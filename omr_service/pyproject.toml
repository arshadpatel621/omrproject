[tool.poetry]
name = "omr-service"
version = "0.1.0"
description = "OMR processing microservice"
authors = ["You <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
numpy = "^2.1.1"
opencv-python-headless = "^4.10.0.84"
